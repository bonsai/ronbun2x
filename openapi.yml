openapi: 3.1.0
info:
  title: ronbun2x Paper-to-Content API
  version: 1.0.0
  description: >-
    arXiv論文を取得し、4つの表示・生成モード向けに構造化したJSONへ変換する。
    このAPIは生成物そのものではなく、後続のGeneration Pipelineへ渡すハンドオフを返す。
servers:
  - url: https://ronbun2x.{worker-domain}
    description: Cloudflare Worker deployment URL; replace with the deployed Worker URL.
paths:
  /api:
    get:
      operationId: createPaperHandoff
      summary: 論文を指定モードのハンドオフJSONへ変換
      parameters:
        - name: url
          in: query
          required: true
          description: arXiv abstract or PDF URL
          schema:
            type: string
            format: uri
            pattern: '^https?://(arxiv\\.org|export\\.arxiv\\.org)/'
          example: https://arxiv.org/abs/2606.10839
        - name: x
          in: query
          required: true
          description: 表示・生成モード。旧来のクエリ名 x を維持する。
          schema:
            $ref: '#/components/schemas/DisplayMode'
          example: yonkoma
      responses:
        '200':
          description: 後続パイプラインへ渡す構造化ハンドオフ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperHandoff'
              examples:
                rakugo:
                  summary: SF落語モード
                  value:
                    schema: ronbun2x.handoff.v1
                    arxiv_id: '2606.10839'
                    source_url: https://arxiv.org/abs/2606.10839
                    pdf_url: https://arxiv.org/pdf/2606.10839.pdf
                    x: rakugo
                    language: ja
                    payload:
                      summary: 論文の日本語要約
                      characters: []
                      scenes: []
                    next: generation
                yonkoma:
                  summary: 4コマ漫画モード
                  value:
                    schema: ronbun2x.handoff.v1
                    arxiv_id: '2606.10839'
                    source_url: https://arxiv.org/abs/2606.10839
                    pdf_url: https://arxiv.org/pdf/2606.10839.pdf
                    x: yonkoma
                    language: ja
                    payload:
                      panels: []
                    next: generation
                two_line:
                  summary: 2行会話モード
                  value:
                    schema: ronbun2x.handoff.v1
                    arxiv_id: '2606.10839'
                    source_url: https://arxiv.org/abs/2606.10839
                    pdf_url: https://arxiv.org/pdf/2606.10839.pdf
                    x: two_line
                    language: ja
                    payload:
                      lines: []
                    next: generation
                screenshot:
                  summary: スクリーンショットムービーモード
                  value:
                    schema: ronbun2x.handoff.v1
                    arxiv_id: '2606.10839'
                    source_url: https://arxiv.org/abs/2606.10839
                    pdf_url: https://arxiv.org/pdf/2606.10839.pdf
                    x: screenshot
                    language: ja
                    payload:
                      scenes: []
                    next: generation
        '400':
          description: URLまたはモードが不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 論文の取得または変換に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    DisplayMode:
      type: string
      enum:
        - rakugo
        - yonkoma
        - two_line
        - screenshot
      description: 4つの表示・生成モード
    PaperHandoff:
      type: object
      required: [schema, arxiv_id, source_url, pdf_url, x, language, payload, next]
      properties:
        schema:
          type: string
          const: ronbun2x.handoff.v1
        arxiv_id:
          type: string
        source_url:
          type: string
          format: uri
        pdf_url:
          type: string
          format: uri
        x:
          $ref: '#/components/schemas/DisplayMode'
        language:
          type: string
          default: ja
        payload:
          type: object
          description: モード別のデータ。厳密なpayloadスキーマは各生成先が管理する。
          additionalProperties: true
        next:
          type: string
          const: generation
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string
